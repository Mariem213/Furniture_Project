<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon">
    <title>Furniture Shop | Login & Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <!-- CSS files -->
    <link rel="stylesheet" href="CSS/login_rigster.css">
</head>

<body>

    <section class="log">
        <div class="container-fluid">
            <div id="contain" class="contain">
                <div class="row">

                    <!-- Sign-Up -->
                    <div class="col-12 col-md-6 d-flex align-items-center justify-content-center text-center">
                        <div class="form-wrapper d-flex align-items-center justify-content-center text-center">
                            <div class="form sign-up">
                                <div class="input-group">
                                    <i class="bi bi-person"></i>
                                    <input type="text" class="signup-username" placeholder="Username">
                                    <small class="error-message text-danger"></small>
                                </div>
                                <div class="input-group">
                                    <i class="bi bi-envelope"></i>
                                    <input type="email" class="signup-email" placeholder="Email">
                                    <small class="error-message text-danger"></small>
                                </div>
                                <div class="input-group pass">
                                    <i class="bi bi-lock"></i>
                                    <input type="password" class="signup-password" id="signup-password"
                                        placeholder="Password">
                                    <span class="toggle-password" id="toggleSignUpPassword">
                                        <i class="bi bi-eye" id="eyeIconSignUp"></i>
                                    </span>
                                    <small class="error-message text-danger"></small>
                                </div>
                                <div class="input-group conPass">
                                    <i class="bi bi-lock"></i>
                                    <input type="password" class="signup-confirm" id="signup-confirm"
                                        placeholder="Confirm password">
                                    <span class="toggle-password" id="toggleSignUpConfirmPassword">
                                        <i class="bi bi-eye" id="eyeIconConfirm"></i>
                                    </span>
                                    <small class="error-message text-danger"></small>
                                </div>
                                <div class="input-group">
                                    <i class="bi bi-telephone"></i>
                                    <input type="tel" class="signup-phone" placeholder="Phone Number">
                                    <small class="error-message text-danger"></small>
                                </div>
                                <div class="input-group">
                                    <i class="bi bi-image"></i>
                                    <input type="file" class="signup-image" id="userImage" accept="image/*">
                                    <small class="error-message text-danger"></small>
                                </div>
                                <a href="#">
                                    <button>Sign up</button>
                                </a>
                                <p>
                                    Already have an account ?
                                    <span onclick="toggle()">
                                        Sign in here
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Sign-In -->
                    <div class="col-12 col-md-6 d-flex align-items-center justify-content-center text-center">
                        <div class="form-wrapper d-flex align-items-center justify-content-center text-center">
                            <div class="form sign-in">
                                <div class="input-group">
                                    <i class="bi bi-envelope signin-mailicon"></i>
                                    <input type="email" class="signin-email" placeholder="Email">
                                    <small class="error-message text-danger"></small>
                                </div>
                                <div class="input-group">
                                    <i class="bi bi-lock signin-passicon"></i>
                                    <input type="password" class="signin-password" id="signin-password"
                                        placeholder="Password">
                                    <span class="toggle-password" id="toggleSignInPassword">
                                        <i class="bi bi-eye" id="eyeIconSignIn"></i>
                                    </span>
                                    <small class="error-message text-danger"></small>
                                </div>
                                <a href="#">
                                    <button> Sign in </button>
                                </a>
                                <p class="forget">Forgot password ?</p>
                                <p>
                                    Don't have an account ?
                                    <span onclick="toggle()">
                                        Sign up here
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row content-row">
                    <div class="col-6 d-flex align-items-center justify-content-center text-center">
                        <div class="text sign-in">
                            <h2>Welcome</h2>
                        </div>
                    </div>
                    <div class="col-6 d-flex align-items-center justify-content-center text-center">
                        <div class="text sign-up">
                            <h2>Join with us</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Links -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <script src="JS/login_rigster.js"></script>
</body>

</html>
